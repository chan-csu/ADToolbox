[tool.poetry]
name = "adtoolbox"
version = "1.1.3"
description = "A tool for modeling and optimization of anaerobic digestion process."
authors = ["ParsaGhadermazi <54489047+ParsaGhadermazi@users.noreply.github.com>"]
readme= "README.md"
[tool.poetry.dependencies]
python = ">=3.11"
numpy = "^1.22.4"
plotly = ">=5.8.0"
nbformat = ">=4.2.0"
requests = "^2.27.1"
rich = "^12.4.4"
click = "^8.1.7"
scipy = "^1.8.1"
polars = "^0.20.27"
dash = {version = "^2.4.1", optional = true}
dash-bootstrap-components = {version = "^1.3.1", optional = true}
dash-escher = {version = "^0.0.4", optional = true}
torch = {version = "^2.4.1", optional = true}
openbox = {version = ">=0.8.0", optional = true}
pygad = {version = ">=3.0.0", optional = true}

[tool.poetry.extras]
optimize = ["torch", "openbox", "pygad"]
surrogate = ["torch"]
blackbox = ["openbox"]
genetic = ["pygad"]
dashboard = ["dash", "dash-bootstrap-components", "dash-escher"]

[tool.poetry.group.dev.dependencies]
pytest = "^5.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
adtoolbox = 'adtoolbox.__main__:main'
